// Top-level build file where you can add configuration options common to all sub-projects/modules.
//
// Kotlin must match react-native/gradle/libs.versions.toml (RN 0.81 → Kotlin 2.1.20).
// SDK / NDK defaults match RN 0.81 (see react-native/gradle/libs.versions.toml).
//
// Do not use file-level `def` vars inside buildscript {} — EAS/Gradle can evaluate buildscript
// before outer defs exist. Use findProperty here and mirror onto rootProject.ext below.

buildscript {
    ext {
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.1.20'
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
        ndkVersion = findProperty('android.ndkVersion') ?: '27.1.12297006'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

// :app + autolinked modules (expo-updates reads rootProject["kotlinVersion"] for KSP).
ext.kotlinVersion = findProperty('android.kotlinVersion') ?: '2.1.20'
ext.buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
ext.minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
ext.compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
ext.targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
ext.ndkVersion = findProperty('android.ndkVersion') ?: '27.1.12297006'

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
